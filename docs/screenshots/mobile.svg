<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 760" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="1" stop-color="#11161f"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.42"/></filter>
  </defs>

  <rect width="420" height="760" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="20" y="20" width="380" height="720" rx="36" fill="rgba(16,23,34,0.92)" stroke="rgba(120,148,183,0.22)"/>

    <!-- sticky top bar -->
    <rect x="20" y="20" width="380" height="56" fill="rgba(16,23,34,0.94)"/>
    <line x1="20" y1="76" x2="400" y2="76" stroke="rgba(120,148,183,0.18)"/>
    <rect x="34" y="34" width="28" height="24" rx="6" fill="rgba(102,217,239,0.18)" stroke="rgba(102,217,239,0.4)"/>
    <text x="48" y="51" font-size="10" font-weight="800" fill="#66d9ef" text-anchor="middle">SC</text>
    <text x="72" y="50" font-size="13" font-weight="700" fill="#e7edf7">Secure Text Compare</text>
    <rect x="284" y="38" width="50" height="20" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(120,148,183,0.18)"/>
    <text x="309" y="51" font-size="10" fill="#95a3b8" text-anchor="middle">7 chg</text>
    <rect x="340" y="38" width="50" height="20" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(120,148,183,0.18)"/>
    <text x="365" y="51" font-size="10" fill="#95a3b8" text-anchor="middle">142 w</text>

    <!-- editor left -->
    <rect x="30" y="92" width="360" height="140" rx="10" fill="rgba(7,11,18,0.6)" stroke="rgba(120,148,183,0.18)"/>
    <text x="42" y="110" font-size="9" fill="#95a3b8" letter-spacing="0.06em">LEFT TEXT</text>
    <text x="92" y="110" font-size="11" font-weight="700" fill="#e7edf7">v1.0.txt</text>
    <g font-family="SFMono-Regular, monospace" font-size="10" fill="#cfdbe9">
      <text x="42" y="132">Release notes</text>
      <text x="42" y="148">Added project import from</text>
      <text x="42" y="164">local text files.</text>
      <text x="42" y="184">Improved comparison rendering</text>
      <text x="42" y="200">for longer documents.</text>
      <text x="42" y="220">Fixed a layout issue in the</text>
    </g>

    <!-- editor right -->
    <rect x="30" y="244" width="360" height="140" rx="10" fill="rgba(7,11,18,0.6)" stroke="rgba(120,148,183,0.18)"/>
    <text x="42" y="262" font-size="9" fill="#95a3b8" letter-spacing="0.06em">RIGHT TEXT</text>
    <text x="98" y="262" font-size="11" font-weight="700" fill="#e7edf7">v1.1.txt</text>
    <g font-family="SFMono-Regular, monospace" font-size="10" fill="#cfdbe9">
      <text x="42" y="284">Release notes</text>
      <text x="42" y="300">Added project import from</text>
      <text x="42" y="316">local text and markdown files.</text>
      <text x="42" y="336">Improved comparison rendering</text>
      <text x="42" y="352">with synchronized scrolling.</text>
      <text x="42" y="372">Fixed a layout issue in the</text>
    </g>

    <!-- diff frame -->
    <rect x="30" y="396" width="360" height="246" rx="10" fill="rgba(8,13,20,0.7)" stroke="rgba(120,148,183,0.18)"/>
    <rect x="30" y="396" width="360" height="32" fill="rgba(7,11,18,0.5)"/>
    <text x="42" y="416" font-size="10" font-weight="700" fill="#e7edf7">DIFF</text>
    <rect x="170" y="402" width="180" height="20" rx="5" fill="rgba(7,11,18,0.76)" stroke="#2c3b52"/>
    <text x="178" y="416" font-size="10" fill="#5e6d82">Search...</text>
    <text x="370" y="418" font-size="11" fill="#95a3b8">⛶</text>

    <g font-family="SFMono-Regular, monospace" font-size="10" fill="#e7edf7">
      <text x="42" y="446">Release notes Added project</text>
      <text x="42" y="464">import from local</text>
      <g><rect x="42" y="470" width="120" height="14" rx="3" fill="rgba(59,188,116,0.16)"/><text x="46" y="481" fill="#b9f8d1">text and markdown</text></g>
      <text x="42" y="498">files Improved comparison</text>
      <text x="42" y="514">rendering</text>
      <g><rect x="100" y="504" width="148" height="14" rx="3" fill="rgba(59,188,116,0.16)"/><text x="104" y="515" fill="#b9f8d1">with synchronized scrolling</text></g>
      <text x="42" y="534">Fixed a layout issue in the</text>
      <g><rect x="200" y="524" width="56" height="14" rx="3" fill="rgba(247,199,95,0.17)"/><text x="204" y="535" fill="#ffe6a6">panel</text></g>
      <g><rect x="42" y="546" width="290" height="14" rx="3" fill="rgba(59,188,116,0.16)"/><text x="46" y="557" fill="#b9f8d1">Added hover metadata for changed words</text></g>
    </g>

    <!-- horizontal minimap strip -->
    <line x1="30" y1="596" x2="390" y2="596" stroke="rgba(120,148,183,0.18)"/>
    <g transform="translate(38,604)">
      <rect x="0" y="0" width="56" height="22" rx="4" fill="#62d394"/><text x="28" y="15" font-size="10" font-weight="800" fill="#062512" text-anchor="middle">+9</text>
      <rect x="64" y="0" width="56" height="22" rx="4" fill="#62d394"/><text x="92" y="15" font-size="10" font-weight="800" fill="#062512" text-anchor="middle">+4</text>
      <rect x="128" y="6" width="56" height="2" rx="1" fill="#f7c75f"/>
      <rect x="192" y="0" width="56" height="22" rx="4" fill="#ff7185"/><text x="220" y="15" font-size="10" font-weight="800" fill="#30070f" text-anchor="middle">-3</text>
      <rect x="256" y="0" width="56" height="22" rx="4" fill="#62d394"/><text x="284" y="15" font-size="10" font-weight="800" fill="#062512" text-anchor="middle">+5</text>
    </g>

    <!-- sticky bottom controls -->
    <rect x="20" y="660" width="380" height="80" fill="rgba(16,23,34,0.96)"/>
    <line x1="20" y1="660" x2="400" y2="660" stroke="rgba(120,148,183,0.2)"/>
    <g font-size="10" font-weight="800" fill="#e7edf7">
      <rect x="30" y="672" width="52" height="40" rx="8" fill="#1d2b3e" stroke="#2c3b52"/><text x="56" y="690" text-anchor="middle">✓</text><text x="56" y="704" font-size="9" fill="#95a3b8" text-anchor="middle">Check</text>
      <rect x="88" y="672" width="52" height="40" rx="8" fill="#1d2b3e" stroke="#2c3b52"/><text x="114" y="690" text-anchor="middle">L</text><text x="114" y="704" font-size="9" fill="#95a3b8" text-anchor="middle">Load left</text>
      <rect x="146" y="672" width="52" height="40" rx="8" fill="#1d2b3e" stroke="#2c3b52"/><text x="172" y="690" text-anchor="middle">R</text><text x="172" y="704" font-size="9" fill="#95a3b8" text-anchor="middle">Load right</text>
      <rect x="204" y="672" width="52" height="40" rx="8" fill="#1d2b3e" stroke="#2c3b52"/><text x="230" y="690" text-anchor="middle">H</text><text x="230" y="704" font-size="9" fill="#95a3b8" text-anchor="middle">Report</text>
      <rect x="262" y="672" width="52" height="40" rx="8" fill="#1d2b3e" stroke="#2c3b52"/><text x="288" y="690" text-anchor="middle">↻</text><text x="288" y="704" font-size="9" fill="#95a3b8" text-anchor="middle">Update</text>
      <rect x="332" y="678" width="58" height="32" rx="8" fill="#1d2b3e" stroke="#2c3b52"/><text x="361" y="698" text-anchor="middle" fill="#95a3b8" font-weight="600">More</text>
    </g>
  </g>
</svg>
